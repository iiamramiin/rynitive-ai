services:
  - type: web
    name: rynitive-ai
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python -m spacy download en_core_web_lg
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: ENVIRONMENT
        value: production
      - key: MAX_FILE_SIZE_MB
        value: 20
    autoDeploy: true
    healthCheckPath: /health
